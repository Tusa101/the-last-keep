name: Deploy newest THE LAST KEEP ZIP to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/deploy.yml'
      - 'scripts/select_latest.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select and extract latest versioned archive
        run: python3 scripts/select_latest.py --root . --output _game
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: _game
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Core TypeScript check
        working-directory: _game
        run: npm run typecheck:core
      - name: Run unit tests
        working-directory: _game
        run: npm test
      - name: Run deterministic three-wave balance regression
        working-directory: _game
        run: npm run check:balance
      - name: Build for GitHub Pages
        working-directory: _game
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
      - name: Write release version receipt
        working-directory: _game
        run: npm run write:release
      - name: Verify production assets and GitHub Pages base path
        working-directory: _game
        run: npm run verify:dist
      - name: Install browser for smoke test
        working-directory: _game
        run: npx playwright install --with-deps chromium
      - name: Test startup recovery UI without depending on WebGL
        working-directory: _game
        run: npm run smoke:boot
      - name: Run independent mobile layout smoke test
        working-directory: _game
        run: npm run smoke:ui
      - name: Run onboarding layout and menu smoke test
        working-directory: _game
        run: npm run smoke:tutorial
      - name: Smoke-test the actual production bundle (with Pages subpath)
        working-directory: _game
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            export SMOKE_URL="http://127.0.0.1:4173/"
          else
            export SMOKE_URL="http://127.0.0.1:4173/$REPO/"
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          READY=false
          for i in $(seq 1 45); do
            if curl --silent --show-error --fail "$SMOKE_URL" -o /dev/null; then READY=true; break; fi
            sleep 1
          done
          if [ "$READY" != true ]; then cat /tmp/vite-preview.log; exit 1; fi
          npm run smoke
          npm run smoke:slice
          npm run smoke:devices
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: |
            _game/smoke-*.png
            _game/slice-*.png
            _game/dist/
            _game/boot-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _game/dist
      - id: deployment
        uses: actions/deploy-pages@v4
